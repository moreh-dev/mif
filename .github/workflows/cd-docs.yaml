name: docs-production-deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "website/**"

jobs:
  build:
    name: Build Docusaurus
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    defaults:
      run:
        working-directory: website

    env:
      ORGANIZATION_NAME: "moreh-dev"
      PROJECT_NAME: "docs.moreh.io-published"
      DEPLOYMENT_BRANCH: "publish-build"
      # docusaurus deploy pushes to https://<GIT_USER>:<GIT_PASS>@github.com/...,
      # and a GitHub App installation token authenticates as "x-access-token".
      GIT_USER: "x-access-token"
      GIT_USER_NAME: "moreh-release-automation[bot]"
      GIT_USER_EMAIL: "316831042+moreh-release-automation[bot]@users.noreply.github.com"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Mint a token for the publishing repository
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: moreh-dev
          repositories: docs.moreh.io-published

      - name: Deploy to GitHub Pages
        env:
          GIT_PASS: ${{ steps.app-token.outputs.token }}
        run: npm run deploy
